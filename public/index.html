<html>
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.7.1/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.7.1/addons/p5.dom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.7.1/addons/p5.sound.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
	<script src='jquery.js'> </script>
	<script src='config.js'> </script>
	
	<link rel='stylesheet' href='css/style.css' />
	
  </head>
  <body>
    <script src="sketch.js"></script>
	
	<div id="gui" >
		<label>C1</label><input type="color" value="#FF0000" id="c1">
		<label>C2</label><input type="color" value="#00FFFF" id="c2">
		<br>
		<label>Alfa Figure</label>
		<input type="range" value="30" id="alphaValue" min="0" max ="255" step="1" class="jpslider" >
		<br>
		<label>Alfa Border</label>
		<input type="range" value="127" id="alphaBorder" min="0" max ="255" step="1" class="jpslider" >
		<br>
		<label>Border size</label>
		<input type="range" value="1" id="borderSize" min="1" max ="10" step="1" class="jpslider" >
		<br>
		<label>Max size</label>
		<input type="range" value="25" id="maxSize" min="0" max ="50" step="0.1" class="jpslider" >
		<br>
		<label>Max amp</label>
		<input type="range" value="300" id="maxAmp" min="0" max ="500" step="1" class="jpslider"  >
		<br>
		<label>Puntas</label>
		<input type="range" value="7" id="numPuntas" min="3" max ="10"  step="1" class="jpslider" >
		<br>
		<label>Cantidad circulos</label>
		<input type="range" value="5" id="numCirculos" min="1" max ="20" step="1" class="jpslider" >
		<br>
		<label>Circular Speed</label>
		<input type="range" value="0" id="circularSpeed" min="-5" max ="5" step="0.01" class="jpslider" >
		<br>
		<label>Amp speed</label>
		<input type="range" value="1" id="ampSpeed" min="0" max ="4" step="0.01" class="jpslider" >
		<br>
		<label>Size speed</label>
		<input type="range" value="4" id="sizeSpeed" min="1" max ="20" step="0.01" class="jpslider" >
		<br>
		
		<input type="button" value="Randomize" onClick="randomValues()" id="rdmvalues" class="jpboton">
		
		<input type="button" value="No Border" onClick="changeBorder()" id="changborder" class="jpboton">
		<br>
		<input type="button" value="Close GUI" onClick="closeGui()" id="closegui" class="jpboton">
		
		<input type="button" value="Background" onClick="cleanBackground()" id="resetbackground" class="jpboton">
	</div>
	
	<input type="button" value="Open GUI" onClick="openGui()" id="opengui" class="jpboton">
	
  <script src="general.js"></script>
  </body>
</html>
